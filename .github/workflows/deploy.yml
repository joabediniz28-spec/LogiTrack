name: "🚀 GitOps Continuous Deployment (CD)"

on:
  push:
    branches:
      - main
    paths:
      - "fase-3-api-serverless/**"

jobs:
  terraform-deploy:
    name: "Deploy Infra & Lambda API"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fase-3-api-serverless

    # Centraliza as credenciais para todos os steps do job
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-2"

    steps:
      - name: "Checkout do Código"
        uses: actions/checkout@v4

      - name: "Configurar o Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Instalar o Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: "Terraform Format Check"
        run: terraform fmt -check

      - name: "Terraform Init"
        run: terraform init -reconfigure

      - name: "Terraform Plan"
        run: terraform plan -out=tfplan

      - name: "Terraform Apply"
        run: terraform apply -auto-approve tfplan
